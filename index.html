<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clair Alpha</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/section-world.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/media.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="header">
    <img src="assets/logo.svg" alt="Logo" class="logo">

    <nav class="nav-center">
      <a href="#">About</a>
      <a href="#">Discover</a>
      <a href="#">Pricing</a>
    </nav>

    <div class="header-right">
      <button class="icon-btn" title="Lenguaje">
        <i data-lucide="globe"></i>
      </button>
      <button class="icon-btn" title="Usuario">
        <i data-lucide="circle-user"></i>
      </button>
    </div>

    <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
      <i data-lucide="menu"></i>
    </button>

    <div class="mobile-menu" aria-hidden="true">
      <nav class="mobile-nav">
        <a href="#">About</a>
        <a href="#">Discover</a>
        <a href="#">Pricing</a>
      </nav>
      <div class="mobile-actions">
        <button class="icon-btn" title="Lenguaje">
          <i data-lucide="globe"></i>
        </button>
        <button class="icon-btn" title="Usuario">
          <i data-lucide="circle-user"></i>
        </button>
      </div>
    </div>
  </header>

  <section class="section-1">
    <canvas id="graph-world"></canvas>
  </section>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/main.js" defer></script>
</body>
</html>
